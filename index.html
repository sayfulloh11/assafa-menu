function rCartItems(){var t=T[lang];document.getElementById("cartModalTitle").textContent=t.ct;document.getElementById("totalLbl").textContent=t.tl;document.getElementById("waBtnLbl").textContent=t.wb;var list=document.getElementById("cartItemsList");list.innerHTML="";var items=Object.entries(cart).filter(function(e){return e[1]>0;});if(!items.length){list.innerHTML='<div class="empty-cart"><div style="font-size:44px">&#128722;</div>'+t.ec+'<br><small>'+t.es+'</small></div>';document.getElementById("cartTotalRow").style.display="none";document.getElementById("waBtn").style.display="none";return;}items.forEach(function(e){var item=MENU.find(function(m){return m.id==e[0];});if(!item)return;var qty=e[1];var div=document.createElement("div");div.className="cart-item";div.innerHTML='<img class="ci-img" src="'+(item.img||"")+'" onerror=\"this.style.display=&#39;none&#39;\"><div class="ci-info"><div class="ci-name">'+item.name[lang]+'</div><div class="ci-price">'+(item.price>0?(item.price*qty+" "+t.sar):"--")+'</div></div><div class="ci-controls"><button class="ci-btn" onclick="chQty('+item.id+',-1)">-</button><span class="ci-qty">'+qty+'</span><button class="ci-btn" onclick="chQty('+item.id+',1)">+</button></div>';list.appendChild(div);});var tt=total();document.getElementById("cartTotalPrice").textContent=tt>0?tt+" "+T[lang].sar:"--";document.getElementById("cartTotalRow").style.display="flex";document.getElementById("waBtn").style.display="flex";}
function openPayModal(){pay=null;var t=T[lang];document.getElementById("payTitle").textContent="&#128179; "+t.pt;document.getElementById("paySubtitle").textContent=t.ps;document.getElementById("cashLabel").textContent=t.cl;document.getElementById("cashDesc").textContent=t.cd;document.getElementById("cardLabel").textContent=t.kl;document.getElementById("cardDesc").textContent=t.kd;document.getElementById("payConfirmLbl").textContent=t.cf;document.getElementById("payCancelLbl").textContent=t.cn;document.getElementById("optCash").classList.remove("selected");document.getElementById("optCard").classList.remove("selected");document.getElementById("payConfirmBtn").classList.remove("ready");document.getElementById("payOverlay").classList.add("open");}
function selectPayment(type){pay=type;document.getElementById("optCash").classList.toggle("selected",type==="cash");document.getElementById("optCard").classList.toggle("selected",type==="card");document.getElementById("payConfirmBtn").classList.add("ready");}
function closePayModal(){document.getElementById("payOverlay").classList.remove("open");pay=null;}
function confirmPaymentAndSend(){if(!pay)return;var t=T[lang];var lines=Object.entries(cart).filter(function(e){return e[1]>0;}).map(function(e){var item=MENU.find(function(m){return m.id==e[0];});return t.il(item.name[lang],e[1],item.price>0?item.price*e[1]:"--");});var tt=total();var pw=pay==="cash"?t.cw:t.kw;var msg=t.om(lines.join("\n"),tt>0?tt:"--",pw);closePayModal();window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(msg),"_blank");}
function openAdmin(){rAdminList();document.getElementById("adminOverlay").classList.add("open");document.body.style.overflow="hidden";}
function closeAdmin(){document.getElementById("adminOverlay").classList.remove("open");document.body.style.overflow="";eid=null;}
function showTab(tab){["add","list","settings"].forEach(function(t){document.getElementById("tab"+t.charAt(0).toUpperCase()+t.slice(1)+"Content").style.display=t===tab?"block":"none";document.getElementById("tab"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("active",t===tab);});if(tab==="list")rAdminList();}
function previewImg(){var url=document.getElementById("newImg").value.trim();var p=document.getElementById("imgPreview");if(url){p.src=url;p.classList.add("show");}else p.classList.remove("show");}
function addItem(){var ar=document.getElementById("newNameAr").value.trim(),en=document.getElementById("newNameEn").value.trim(),uz=document.getElementById("newNameUz").value.trim(),ru=document.getElementById("newNameRu").value.trim();if(!ar&&!en&&!uz&&!ru){alert("Kamida bitta nom kiriting!");return;}var item={id:eid||nid++,category:document.getElementById("newCat").value,e:document.getElementById("newEmoji").value||"&#127869;&#65039;",img:document.getElementById("newImg").value.trim()||null,price:parseFloat(document.getElementById("newPrice").value)||0,name:{ar:ar||en||uz,en:en||ar||uz,uz:uz||en||ar,ru:ru||en||ar},desc:{ar:document.getElementById("newDescAr").value,en:document.getElementById("newDescEn").value,uz:document.getElementById("newDescUz").value,ru:document.getElementById("newDescRu").value}};if(eid){var idx=MENU.findIndex(function(m){return m.id===eid;});if(idx>-1)MENU[idx]=item;eid=null;}else MENU.push(item);clearForm();menu();alert("Menyuga qo'shildi!");}
function clearForm(){["newNameAr","newNameEn","newNameUz","newNameRu","newDescAr","newDescEn","newDescUz","newDescRu","newImg","newPrice","newEmoji"].forEach(function(id){document.getElementById(id).value="";});document.getElementById("imgPreview").classList.remove("show");eid=null;document.querySelector("#tabAddContent .add-item-btn").textContent="Add to Menu";}
function editItem(id){var item=MENU.find(function(m){return m.id===id;});if(!item)return;eid=id;showTab("add");document.getElementById("newCat").value=item.category;document.getElementById("newEmoji").value=item.e;document.getElementById("newImg").value=item.img||"";document.getElementById("newPrice").value=item.price;document.getElementById("newNameAr").value=item.name.ar;document.getElementById("newNameEn").value=item.name.en;document.getElementById("newNameUz").value=item.name.uz;document.getElementById("newNameRu").value=item.name.ru;document.getElementById("newDescAr").value=item.desc.ar;document.getElementById("newDescEn").value=item.desc.en;document.getElementById("newDescUz").value=item.desc.uz;document.getElementById("newDescRu").value=item.desc.ru;previewImg();document.querySelector("#tabAddContent .add-item-btn").textContent="Save Changes";}
function deleteItem(id){if(!confirm("O'chirasizmi?"))return;MENU=MENU.filter(function(m){return m.id!==id;});delete cart[id];menu();rAdminList();uCart();}
function rAdminList(){var list=document.getElementById("adminItemsList");list.innerHTML="";if(!MENU.length){list.innerHTML='<div class="empty-cart"><div style="font-size:44px">&#128203;</div>No items</div>';return;}MENU.forEach(function(item){var div=document.createElement("div");div.className="admin-list-item";div.innerHTML='<img class="ali-img" src="'+(item.img||"")+'" onerror=\"this.style.display=&#39;none&#39;\"><div class="ali-info"><div class="ali-name">'+(item.name[lang]||item.name.en)+'</div><div class="ali-cat">'+(CATS[item.category]?CATS[item.category][lang]:item.category)+'</div><div class="ali-price">'+(item.price>0?item.price+" SAR":"-- SAR")+'</div></div><div class="ali-actions"><button class="ali-edit" onclick="editItem('+item.id+')">&#9999;&#65039;</button><button class="ali-del" onclick="deleteItem('+item.id+')">&#128465;&#65039;</button></div>';list.appendChild(div);});}
function saveSettings(){var num=document.getElementById("waNumberInput").value.trim();if(num){wa=num;alert("Saqlandi! WhatsApp: +"+num);}}
init();
</script>
